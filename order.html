<!DOCTYPE html>
<html>
<head>
<title>Order Candy</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Place Your Candy Order</h1>
<p>Floating on a Cloud of Sweetness ☁️🍬</p>


<nav class="candy-nav">
  <a href="index.html">🏠 Home</a>
  <a href="menu.html">🍭 Candy Menu</a>
  <a href="gallery.html">🍬 Gallery</a>
  <a href="order.html">📝 Order</a>
  <a href="contact.html">📞 Contact</a>
  <a href="delivery.html">🚚 Delivery</a>
</nav>



<h2>Order Form</h2>


<form id="orderForm">

    <h2>Place Your Candy Order 🍬</h2>

    <div class="row">
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email Address" required>
    </div>

    <div class="row">
        <input type="tel" placeholder="Phone Number" required>
        <input type="text" placeholder="Delivery Address" required>
    </div>

    <div class="row">
        <select required>
            <option value="">Choose Your Candy</option>

            <option value="reeses-cups">Reeses Cups</option>
            <option value="sour-patch-kids">Sour Patch Kids</option>
            <option value="marshmallows">Marshmallows</option>
            <option value="caramel-chews">Caramel Chews</option>
            <option value="candy-canes">Candy Canes</option>
            <option value="gummies">Gummies</option>
            <option value="chocolate-bars">Chocolate Bars</option>
            <option value="lollipops">Lollipops</option>
        </select>

        <input type="number" placeholder="Quantity" min="1" required>
    </div>

    <div class="row">
        <select>
            <option value="">Packaging Type (Optional)</option>
            <option value="standard">Standard Bag</option>
            <option value="gift">Gift Box</option>
            <option value="premium">Premium Box</option>
        </select>

        <select>
            <option value="">Delivery Speed (Optional)</option>
            <option value="standard">Standard Delivery</option>
            <option value="express">Express Delivery</option>
        </select>
    </div>

    <button type="submit">Submit Order</button>

</form>

<p id="successMessage" style="display:none; color:green; font-weight:bold; margin-top:10px;">
    🎉 Your order has been successfully received!
</p>

<script>
document.getElementById("orderForm").addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("successMessage").style.display = "block";

    this.reset();
});
</script>

<footer>
    <p>© 2026 Candy Cloud | Sweetness in Every Bite ☁️🍬</p>
    <p>Follow us: Instagram | Facebook | Twitter</p>
  </footer>

</body>
</html>
