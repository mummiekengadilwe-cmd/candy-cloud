<h2>Order Form</h2>


<form>
    
    <form class="p-4 border rounded bg-light">

  <div class="mb-3">
    <label class="form-label">Name</label>
    <input type="text" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" class="form-control" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Choose Your Candy</label>
    <select class="form-select" required>
      <option selected disabled>Select a candy</option>
      <option>Gummies</option>
      <option>Chocolate</option>
      <option>Lollipops</option>
      <option>Chewy Sweets</option>
      <option>Hard Candy</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Quantity</label>
    <input type="number" class="form-control" min="1" max="100" value="1" required>
  </div>

  <button type="submit" class="btn btn-success">
    Submit Order
  </button>

</form>

<footer>

  </footer>
